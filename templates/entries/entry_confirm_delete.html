{% extends "base.html" %}

{% block title %}Delete {{ entry }}{% endblock %}

{% block content %}
    <h1>Delete {{ entry }}</h1>
    <p>This entry will be removed.</p>
    <form method="post">
        {% csrf_token %}
        {% include "partials/form_fields.html" %}
        <button class="btn btn-danger" type="submit">Delete</button>
        <a href="{{ entry.get_absolute_url }}">Cancel</a>
    </form>
{% endblock %}
